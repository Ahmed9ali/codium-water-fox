name: Build WaterFox APK

on:
  workflow_dispatch: # Allows you to click "Run workflow" manually
  push:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app:assemblePlayDebug \
            -PuseProprietaryFont=false \
            --no-configuration-cache \
            --no-build-cache \
            -x spotlessCheck \
            -x spotlessApply \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1024m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waterfox-debug-apk
          path: app/build/outputs/apk/play/debug/*.apk